name: Daily DCF Alpha-Momentum Paper Trading

on:
  schedule:
    # Runs every day (Monday to Sunday) at 3:00 PM CST (21:00 UTC) to finalize the daily paper trading cycle and accrue sweeps
    - cron: '0 21 * * *'
    # Runs Monday to Friday, every 30 minutes during CST market hours (8:30 AM to 2:30 PM CST)
    # 8:30 AM CST = 14:30 UTC
    - cron: '30 14 * * 1-5'
    # 9:00 AM CST to 2:30 PM CST = 15:00 UTC to 20:30 UTC
    - cron: '0,30 15-20 * * 1-5'
    # 3:45 PM ET (19:45 UTC) - signal rebalancing before close
    - cron: '45 19 * * 1-5'
  workflow_dispatch:
    # Allows you to manually trigger this run from the GitHub Actions tab

permissions:
  contents: write # Permits the bot to commit changes back to your repository

jobs:
  # GitHub delays crons unpredictably (a delayed run once fired at 06:15 UTC =
  # 00:15 CDMX and traded on stale/NaN data). Scheduled runs outside the
  # 13:00-22:59 UTC window are skipped; manual dispatches always pass.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          H=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: gate bypassed."
          elif [ "$H" -ge 13 ] && [ "$H" -le 22 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Outside 13:00-22:59 UTC trading window (UTC hour $H); skipping."
          fi

  run-paper-trading:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}

    steps:
    # 1. Checkout the repository code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Set up Python 3.11 environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent runs by caching packages

    # 3. Install required libraries
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute Portfolio Performance Scraper (accrues interest, updates prices)
    - name: Run Portfolio Monitor
      run: python monitor_portfolio.py

    # 5. Execute Live DCF Alpha-Momentum Strategy (handles quarterly rebalancing & active DCA)
    - name: Run Live Alpha Growth Strategy
      run: python run_live_alpha_growth.py

    # 5b. Execute Live MACD Strategy Ingestion
    - name: Run Live MACD Ingestion
      run: python ingest_live_macd.py

    # 5c. Execute Live US Stock Momentum Strategy Ingestion (Isolated)
    - name: Run Live US Stock Momentum Strategy
      run: python run_live_alpaca_us_stocks.py

    # 5d. Execute Live US Stock DCS Value-Growth Strategy (Isolated)
    - name: Run Live US Stock DCS Value-Growth Strategy
      run: python run_live_alpaca_us_stocks_dcf.py

    # 5e. Execute Live Alternative Assets Strategy (Isolated)
    - name: Run Live Alternative Assets Strategy
      run: python run_live_alternatives.py

    # 5f. Execute Live High-Beta Momentum Strategy (Isolated)
    - name: Run Live High-Beta Momentum Strategy
      run: python run_live_high_beta.py

    # 5ff. Execute Live Dividend Quality & Yield Strategy (Isolated)
    - name: Run Live Dividend Quality & Yield Strategy
      run: python run_live_dividends.py

    # 5fff. Execute Live AI-Regime Adaptive Stat-Arb Strategy (Isolated)
    - name: Run Live AI Regime Stat-Arb Strategy
      run: python run_live_strategy9.py

    # 5ffff. Execute Live AI Intraday VWAP Strategy (Isolated)
    - name: Run Live AI Intraday VWAP Strategy
      run: python run_live_strategy10.py

    # 5fffff. Execute Live AI Intraday CCI-ADX Strategy (Twin)
    - name: Run Live AI Intraday CCI-ADX Strategy
      run: python run_live_strategy11.py

    # 5ffffff. Execute Live Strategy 12 VTTL
    - name: Run Live Strategy 12 VTTL
      run: python run_live_strategy12.py

    # 5fffffff. Execute Live Strategy 13 CARA
    - name: Run Live Strategy 13 CARA
      run: python run_live_strategy13.py

    # 5ffffffff. Execute Live Strategy 14 HEDGE
    - name: Run Live Strategy 14 HEDGE
      run: python run_live_strategy14.py

    # 5fffffffff. Execute Live Strategy 15 TRACK
    - name: Run Live Strategy 15 TRACK
      run: python run_live_strategy15.py

    # 5fffffffff-2. Execute Live Strategy 16 HMM Router
    - name: Run Live Strategy 16 HMM Router
      run: python run_live_strategy16.py

    # 5g. Execute Live Multi-Strategy Orchestration
    - name: Run Live Multi-Strategy Orchestrator
      run: python run_live_multi_strategy.py

    # 5h. Run Performance Comparison
    - name: Compare Strategy Performances
      run: python compare_strategies.py

    # 5i. Run Evidence-Quality Report Generator
    - name: Generate Clean Performance Report
      run: python generate_clean_report.py

    # 5i-2. Run Strategy Graduation Report (paper -> live readiness)
    - name: Generate Graduation Report
      run: python graduation_report.py

    # 5j. Run Watchdog Auditor
    - name: Run Watchdog Audit
      run: python watchdog.py
      env:
        APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY }}
        APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        APCA_API_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}

    # 6. Automatically Commit & Push Updated Reports
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add HALT_*.flag 2>/dev/null; git add portfolio.json portfolio_status.md portfolio_macd.json transactions_macd.md portfolio_us_stocks.json transactions_us_stocks.md portfolio_us_dcs.json transactions_us_dcs.md us_stocks_dcf_report_live.md portfolio_alternatives.json transactions_alternatives.md alternatives_report_live.md portfolio_high_beta.json transactions_high_beta.md high_beta_report_live.md portfolio_multi_strategy.json multi_strategy_report_live.md multi_strategy_allocation_history.md all_strategies_allocation_history.md all_strategies_history.json consolidated_portfolio_nav.csv comparison_report.md mexican_value_equity_report_live.md mexican_value_equity_report_live_alpha.md transactions.md evaluation_history.md signal_history.json equity_curve.json learned_params.json portfolio_dividends.json transactions_dividends.md dividends_report_live.md dividends_backtest_nav.csv dividends_backtest_report.md portfolio_strategy9.json transactions_strategy9.md strategy9_report_live.md strategy9_backtest_nav.csv strategy9_backtest_report.md portfolio_strategy10.json transactions_strategy10.md strategy10_report_live.md strategy10_backtest_nav.csv strategy10_backtest_report.md portfolio_strategy11.json transactions_strategy11.md strategy11_report_live.md strategy11_backtest_nav.csv strategy11_backtest_report.md portfolio_strategy12.json transactions_strategy12.md strategy12_report_live.md strategy12_backtest_nav.csv strategy12_backtest_report.md portfolio_strategy13.json transactions_strategy13.md strategy13_report_live.md strategy13_backtest_nav.csv strategy13_backtest_report.md portfolio_strategy14.json transactions_strategy14.md strategy14_report_live.md strategy14_backtest_nav.csv strategy14_backtest_report.md portfolio_strategy15.json transactions_strategy15.md strategy15_report_live.md strategy15_backtest_nav.csv strategy15_backtest_report.md portfolio_strategy16.json transactions_strategy16.md strategy16_report_live.md strategy16_backtest_nav.csv strategy16_backtest_report.md watchdog_report.md watchdog_nav_history.json graduation_report.md || true
        
        # Commit only if files have changed (to prevent error crashes on identical runs)
        git diff-index --quiet HEAD || (git commit -m "Auto-update: Multi-strategy concentrated paper trading [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" && git push)

