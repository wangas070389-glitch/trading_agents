name: Daily DCF Alpha-Momentum Paper Trading

on:
  schedule:
    # Runs Monday to Friday at 22:30 UTC (4:30 PM Mexico City CST)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    # Allows you to manually trigger this run from the GitHub Actions tab

permissions:
  contents: write # Permits the bot to commit changes back to your repository

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}

    steps:
    # 1. Checkout the repository code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Set up Python 3.11 environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent runs by caching packages

    # 3. Install required libraries
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute Portfolio Performance Scraper (accrues interest, updates prices)
    - name: Run Portfolio Monitor
      run: python monitor_portfolio.py

    # 5. Execute Live DCF Alpha-Momentum Strategy (handles quarterly rebalancing & active DCA)
    - name: Run Live Alpha Growth Strategy
      run: python run_live_alpha_growth.py

    # 5b. Execute Live MACD Strategy Ingestion
    - name: Run Live MACD Ingestion
      run: python ingest_live_macd.py

    # 5c. Execute Live US Stock Momentum Strategy Ingestion (Isolated)
    - name: Run Live US Stock Momentum Strategy
      run: python run_live_alpaca_us_stocks.py

    # 5d. Execute Live US Stock DCS Value-Growth Strategy (Isolated)
    - name: Run Live US Stock DCS Value-Growth Strategy
      run: python run_live_alpaca_us_stocks_dcf.py

    # 5e. Run Performance Comparison
    - name: Compare Strategy Performances
      run: python compare_strategies.py

    # 6. Automatically Commit & Push Updated Reports
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add updated database, performance log, evaluation report, transaction ledger, and history
        git add portfolio.json portfolio_status.md portfolio_macd.json transactions_macd.md portfolio_us_stocks.json transactions_us_stocks.md portfolio_us_dcs.json transactions_us_dcs.md us_stocks_dcf_report_live.md comparison_report.md mexican_value_equity_report_live.md mexican_value_equity_report_live_alpha.md transactions.md evaluation_history.md signal_history.json equity_curve.json learned_params.json || true
        
        # Commit only if files have changed (to prevent error crashes on identical runs)
        git diff-index --quiet HEAD || (git commit -m "Auto-update: Multi-strategy concentrated paper trading [$(date -u +%Y-%m-%d)]" && git push)

