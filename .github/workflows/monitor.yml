name: Daily DCF Alpha-Momentum Paper Trading

on:
  schedule:
    # Runs Monday to Friday at 22:30 UTC (4:30 PM Mexico City CST)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    # Allows you to manually trigger this run from the GitHub Actions tab

permissions:
  contents: write # Permits the bot to commit changes back to your repository

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Set up Python 3.11 environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent runs by caching packages

    # 3. Install required libraries
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute Portfolio Performance Scraper (accrues interest, updates prices)
    - name: Run Portfolio Monitor
      run: python monitor_portfolio.py

    # 5. Execute Live DCF Alpha-Momentum Strategy (handles quarterly rebalancing & active DCA)
    - name: Run Live Alpha Growth Strategy
      run: python run_live_alpha_growth.py

    # 6. Automatically Commit & Push Updated Reports
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add updated database, performance log, transactions, and execution reports
        git add portfolio.json portfolio_status.md transactions.md mexican_value_equity_report_live_alpha.md || true
        
        # Commit only if files have changed (to prevent error crashes on identical runs)
        git diff-index --quiet HEAD || (git commit -m "Auto-update: DCF Alpha-Momentum concentrated paper trading [$(date -u +%Y-%m-%d)]" && git push)

