name: Daily Portfolio Monitor & Market Ingestion

on:
  schedule:
    # Runs Monday to Friday at 22:30 UTC (4:30 PM Mexico City CST)
    - cron: '30 22 * * 1-5'
    # Saturday 14:00 UTC: weekly walk-forward threshold training
    - cron: '0 14 * * 6'
  workflow_dispatch:
    # Allows you to manually trigger this run from the GitHub Actions tab

permissions:
  contents: write # Permits the bot to commit changes back to your repository

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    # Skip the daily trading job on the Saturday training cron
    if: github.event.schedule != '0 14 * * 6'

    steps:
    # 1. Checkout the repository code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Set up Python 3.11 environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent runs by caching packages

    # 3. Install required libraries
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute Portfolio Performance Scraper
    - name: Run Portfolio Monitor
      run: python monitor_portfolio.py

    # 5. Execute Live BMV Index Screener
    - name: Run Live BMV Ingestion
      run: python ingest_live_bmv.py

    # 6. Automatically Commit & Push Updated Reports
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add updated database, performance log, evaluation report, transaction ledger, and history
        git add portfolio.json portfolio_status.md mexican_value_equity_report_live.md transactions.md evaluation_history.md signal_history.json equity_curve.json learned_params.json || true
        
        # Commit only if files have changed (to prevent error crashes on identical runs)
        git diff-index --quiet HEAD || (git commit -m "Auto-update: Portfolio trades, P/L monitoring & BMV evaluation [$(date -u +%Y-%m-%d)]" && git push)

  weekly-threshold-learning:
    runs-on: ubuntu-latest
    # Only the Saturday cron (or a manual dispatch) trains; daily runs just consume learned_params.json
    if: github.event.schedule == '0 14 * * 6' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Walk-forward threshold training
      run: python learn_parameters.py
    - name: Commit learned parameters
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add learned_params.json || true
        git diff-index --quiet HEAD || (git commit -m "Auto-update: weekly walk-forward threshold training [$(date -u +%Y-%m-%d)]" && git push)
